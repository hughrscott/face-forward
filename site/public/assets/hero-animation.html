<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Forward — Hero Animation</title>
  <style>
    :root {
      --color-forest: #0D1F17;
      --color-emerald: #1B3B2B;
      --color-cream: #F5F2EB;
      --color-gold: #E29D2A;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--color-emerald);
      color: var(--color-cream);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    svg { width: 100%; max-width: 640px; height: auto; overflow: visible; }
    .sliding-text {
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-right { transform: translateX(420px); opacity: 0; }
    .vector-car {
      transition: transform 1.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
      opacity: 0;
    }
    .car-parked { opacity: 1; }
    .caption {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(245, 242, 235, 0.4);
    }
    @media (prefers-reduced-motion: reduce) {
      .sliding-text, .vector-car { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg id="logo-svg" viewBox="0 0 680 480">
      <defs>
        <g id="vector-car-left">
          <rect x="-42" y="-18" width="84" height="38" rx="8" fill="#000000" opacity="0.35" transform="translate(2, 4)" />
          <rect x="-42" y="-18" width="84" height="36" rx="7" fill="#F5F2EB" stroke="#1B3B2B" stroke-width="2.5" />
          <rect x="-20" y="-14" width="18" height="28" rx="3" fill="#1B3B2B" opacity="0.85" />
          <rect x="18" y="-12" width="12" height="24" rx="2" fill="#1B3B2B" opacity="0.85" />
          <rect x="-42" y="-14" width="3" height="6" rx="1.5" fill="#E29D2A" />
          <rect x="-42" y="8" width="3" height="6" rx="1.5" fill="#E29D2A" />
          <path d="M 8 0 L -8 0 M -3 -5 L -8 0 L -3 5" stroke="#1B3B2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </defs>

      <rect x="80" y="40" width="18" height="180" rx="4" fill="#E29D2A" />
      <rect x="80" y="40" width="290" height="16" rx="4" fill="#E29D2A" />
      <rect x="80" y="150" width="240" height="16" rx="4" fill="#E29D2A" />

      <rect x="80" y="250" width="18" height="180" rx="4" fill="#E29D2A" />
      <rect x="80" y="250" width="290" height="16" rx="4" fill="#E29D2A" />
      <rect x="80" y="360" width="240" height="16" rx="4" fill="#E29D2A" />

      <g id="typography-layer">
        <text id="text-ace" x="140" y="132" fill="#F5F2EB" font-size="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" class="sliding-text">ace</text>
        <text id="text-orward" x="140" y="342" fill="#F5F2EB" font-size="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" class="sliding-text">orward</text>
      </g>

      <g id="cars-layer">
        <use id="car-1" href="#vector-car-left" class="vector-car" style="transform: translate(620px, 95px);" />
        <use id="car-2" href="#vector-car-left" class="vector-car" style="transform: translate(620px, 185px);" />
        <use id="car-3" href="#vector-car-left" class="vector-car" style="transform: translate(620px, 305px);" />
        <use id="car-4" href="#vector-car-left" class="vector-car" style="transform: translate(620px, 395px);" />
      </g>
    </svg>
  </div>
  <div class="caption">Face Forward &middot; Brand Identity</div>

  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function parkCars() {
      document.getElementById('text-ace').classList.add('slide-right');
      document.getElementById('text-orward').classList.add('slide-right');
      [
        ['car-1', '195px, 95px', 250],
        ['car-2', '185px, 185px', 480],
        ['car-3', '195px, 305px', 710],
        ['car-4', '185px, 395px', 940],
      ].forEach(([id, pos, delay]) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          el.style.transform = `translate(${pos})`;
          el.classList.add('car-parked');
        }, reduceMotion ? 0 : delay);
      });
    }

    function resetWordmark() {
      document.getElementById('text-ace').classList.remove('slide-right');
      document.getElementById('text-orward').classList.remove('slide-right');
      ['car-1', 'car-2', 'car-3', 'car-4'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.style.transform = `translate(620px, ${[95, 185, 305, 395][i]}px)`;
        el.classList.remove('car-parked');
      });
    }

    function loop() {
      resetWordmark();
      setTimeout(parkCars, 900);
      setTimeout(loop, reduceMotion ? 6000 : 6200);
    }

    if (reduceMotion) {
      parkCars();
    } else {
      loop();
    }
  </script>
</body>
</html>
